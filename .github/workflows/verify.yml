name: Verify Ashenwake
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/cache@v4
        with:
          path: .tools
          key: ashenwake-linux-dotnet-8.0.425-godot-4.6.2-${{ hashFiles('**/packages.lock.json', 'tools/runtime-packs.json', 'tools/package-archives.json', 'tools/bootstrap.sh') }}
      - name: Install verified local toolchain and templates
        run: bash tools/bootstrap.sh --templates
      - name: Compile, format, test, validate content, replay, benchmark, and import
        run: bash tools/verify.sh
      - name: Export and run packaged client
        run: bash tools/export.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashenwake-linux-verification
          path: artifacts/
